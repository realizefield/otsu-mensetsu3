<title>大津町役場 3次面接対策 - 完全採点版（全39問）</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
    font-family: "Hiragino Sans", "Meiryo", sans-serif;

  .q-btn {

  .practice-area {
    background: white;
    padding: 20px;

  .question-display {

  .control-buttons {

  }
  button {

  @keyframes pulse {

  .btn-clear {

  }

  .transcript-box {
    background: #f9f9f9;

    margin-bottom: 15px;

    font-size: 15px;

  }
  .transcript-box.empty {

    color: #333;
    background: #f0f8ff;

  }

  .intent-section {
    background: #fff3bf;
    padding: 12px;
    border-radius: 3px;

  }

  .keywords { margin-top: 10px; }

    display: inline-block;

  .evaluation-result {
    background: #fff;
    border: 2px solid #0066cc;
    padding: 20px;
    border-radius: 3px;
    margin-top: 15px;
  }
  .score-section {
    background: #e6f2ff;
    padding: 20px;
    border-radius: 3px;
    margin-bottom: 25px;
    border-left: 5px solid #0066cc;
  }
  .total-score {
    font-size: 48px;
    font-weight: bold;
    color: #0066cc;
    text-align: center;
  }

    text-align: center;

  .items-section {

  }

  .item-row {

  .item-name {

  }

    text-align: right;

  }

  }
  .score-max {
    font-size: 12px;
    color: #999;
  }

  .feedback-section {
    background: #f9f9f9;
    padding: 15px;
    border-radius: 3px;
    margin-top: 20px;
  }
  .feedback-title {
    font-weight: bold;

    margin-bottom: 12px;

  }

    margin-top: 0;
  }

    background: white;
    padding: 12px;

  .feedback-improve {

  }
  .feedback-content {
    font-size: 14px;

    color: #333;
  }

  .model-answer {
    background: #f0f8ff;
    border-left: 4px solid #0066cc;

    border-radius: 2px;
    margin-top: 20px;
  }
  .model-title {
    font-weight: bold;
    color: #0066cc;
    margin-bottom: 10px;
  }
  .model-content {
    font-size: 14px;
    line-height: 1.8;

  }

  .save-button {
    background: #0066cc;
    color: white;
    padding: 12px 20px;
    margin-top: 20px;
    border: none;
    border-radius: 3px;

    font-weight: bold;
    font-size: 14px;
  }
  .save-button:hover { background: #0052a3; }

  .records-section {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 2px solid #ddd;
  }
  .records-title {
    font-weight: bold;
    color: #0066cc;
    margin-bottom: 15px;
    font-size: 16px;
  }
  .record-item {
    background: #f9f9f9;
    padding: 12px;

  }
  .record-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .record-time {
    font-size: 12px;
    color: #999;
  }
  .record-score {
    font-weight: bold;
    color: #0066cc;

  }
  .record-detail {
    font-size: 13px;
    color: #666;
  }

  .loading-spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid #0066cc;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 8px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .msg {
    margin-top: 10px;
    padding: 12px;
    border-radius: 3px;
    border-left: 4px solid #999;
  }
  .msg.info {
    background: #e7f1ff;
    color: #1c7ed6;
    border-left-color: #1c7ed6;
  }
  .msg.success {
    background: #c3fac3;
    color: #2b8a3e;
    border-left-color: #2b8a3e;
  }
  .msg.error {
    background: #fcc;
    color: #d92d20;
    border-left-color: #d92d20;
  }
  .msg.warning {
    background: #fff3bf;
    color: #d9480f;
    border-left-color: #d9480f;
  }
</style>

<div class="container">
  <h1>🏛️ 大津町役場 3次面接対策</h1>
  <p class="subtitle">項目別採点版（全39問・記録保存機能付き）</p>

  <div class="question-list">
    <h3>質問を選択:</h3>
    <div id="questionButtons"></div>
  </div>

  <div class="practice-area">
    <div id="questionDisplay" class="question-display" style="display:none;">
      <div><strong id="questionText"></strong></div>
    </div>

    <div class="control-buttons">
      <button class="btn-voice" id="voiceBtn" onclick="toggleVoiceInput()">🎤 音声入力開始</button>
      <button class="btn-clear" onclick="clearTranscript()">🗑️ クリア</button>
      <button class="btn-eval" id="evalBtn" onclick="getDetailedEvaluation()">⚡ 採点</button>
    </div>

    <div>
      <label><strong>🎙️ 認識されたテキスト:</strong></label>
      <div id="transcriptBox" class="transcript-box empty">クリックして音声入力を開始...</div>
    </div>

    <div id="intentSection" style="display:none;">
      <div class="intent-section">
        <div class="intent-label">面接官の意図</div>
        <div class="intent-text" id="intentText"></div>
        <div class="keywords" id="keywordArea"></div>
      </div>
    </div>

    <div id="evalResultSection" style="display:none;">
      <div class="evaluation-result">
        <div class="score-section">
          <div class="total-score" id="totalScore">0</div>
          <div class="score-note">（自己点：満点中の編集点）</div>
        </div>

        <div id="detailedScores"></div>

        <div id="feedbackSection"></div>

        <button class="save-button" onclick="saveRecord()">💾 この結果を保存する</button>
      </div>

      <div class="records-section">
        <div class="records-title">保存した記録（最大5件）</div>
        <div id="recordsList"></div>
      </div>
    </div>

    <div id="loadingSection" style="display:none;">
      <div class="msg info">
        <span class="loading-spinner"></span>採点分析を実行中...
      </div>
    </div>

    <div id="statusMessage" style="display:none;"></div>
  </div>
</div>

<script>
const questions = [
  // ========== カテゴリ1: 小論文関連（Q1-Q5） ==========
  { q: "小論文の内容を、1分で説明してください。", intent: "小論文を自分の言葉で要約できるかを見ます。", keywords: ["課題", "解決策", "貢献"], model: "課題は公共交通の使いやすさです。解決策は二点で、一点目は利用者の声をもとに予算の範囲内でルートや時間帯を見直すこと、二点目は広報紙などの複数の媒体でバスや乗合タクシーの情報を周知することです。会計年度任用職員として、まちなかバスでアンケートを取った経験から考えました。" },
  { q: "なぜ、交通を課題に選んだのですか。", intent: "課題選びが自分の経験に根ざしているかを見ます。", keywords: ["会計年度任用職員", "アンケート", "具体的な要望"], model: "会計年度任用職員として、まちなかバスでアンケートを取る機会があり、時間帯やルートについて具体的な要望を直接伺ったからです。町民の皆様の移動は日常の暮らしに直結しているため、行政が取り組む意味が大きいと考えました。" },
  { q: "「交通手段の充実度」とは、具体的にどういう状態ですか。", intent: "言葉が抽象的な部分を具体化できるかを見ます。", keywords: ["具体的", "無理なく移動", "利用者"], model: "小論文では広い言葉を使いましたが、私が考えているのは、町民の方が行きたい時間に行きたい場所へ無理なく移動できる状態です。特に運転免許を持たない高齢の方や学生の方にとって、バスや乗合タクシーが使いやすいことが大切だと考えます。" },
  { q: "あなたが考える、行政の果たすべき役割は何ですか。★重要", intent: "小論文で書かなかった『行政の役割』を聞かれます。★最優先です。", keywords: ["町民の声", "予算", "必要なサービス"], model: "行政の役割は、町民の声を丁寧に聞き、限られた予算の中で、必要な方に必要なサービスが届くよう整えることだと考えます。民間では採算が合いにくい地域や時間帯の移動手段を関係者と協力して確保することも、行政の大切な役割です。" },
  { q: "職員として、どのように貢献したいですか。", intent: "結びの『主体的に行動』の中身を見ます。", keywords: ["担当業務", "正確", "提案"], model: "まず担当業務を正確に覚え、町民の皆様の声を正しく関係者に伝えることから始めます。その上で資料の作成や集計など自分にできる形で政策づくりを支え、改善の提案があれば遠慮せず上司に相談します。" },

  // ========== カテゴリ2: 課題深掘り（Q6-Q9） ==========
  { q: "アンケートは、どのような状況で、どのように取ったのですか。", intent: "経験の具体性と守秘義務の意識を見ます。", keywords: ["会計年度任用職員", "バス", "意見の集計"], model: "会計年度任用職員として、まちなかバスの車内で利用者の方にお声がけし、ご意見を伺いました。個人が特定されないように、ご意見の内容だけを集計しました。" },
  { q: "具体的な要望には、どう対応しますか。", intent: "具体的な要望に現実的に答えられるかを見ます。", keywords: ["要望の理由", "距離", "運行事業者と協議"], model: "まず要望の理由（行き先、利用する時間帯）を詳しく伺います。次に現在のルートとの距離や増える時間、費用を整理し運行事業者と協議します。ルートを変えると遠回りになって他の利用者が不便になることもあります。そのため利用者数のデータも見て全体として良くなるか判断したいと思います。" },
  { q: "乗合タクシーと路線バスの違いを説明してください。", intent: "大津町の実際の施策への理解度を見ます。", keywords: ["予約制", "柔軟性", "採算"], model: "乗合タクシーは予約制で、利用者の希望する時間に柔軟に対応できるメリットがあります。一方路線バスは定時性が保証されるメリットがあります。大津町では、両者を組み合わせることで、町全体の移動ニーズに応えていると理解しています。" },
  { q: "大津町のバスの課題は何だと思いますか。", intent: "自分の視点で課題を整理できるかを見ます。", keywords: ["利用者不足", "運行費用", "認知度"], model: "利用者が思ったより少ないこと、そして認知度が低いことが課題だと考えます。良い施策があっても利用されなければ意味がないため、広報や情報発信の充実が必要だと思います。" },

  // ========== カテゴリ3: 提案の詳細化（Q10-Q12） ==========
  { q: "予算が限られている場合、優先順位をどう考えますか。", intent: "限られたリソースの中での判断力を見ます。", keywords: ["優先度", "費用対効果", "段階的"], model: "最も多くの町民が恩恵を受けるものを優先します。例えば通勤通学の時間帯の充実を先に進めて、その後に買い物の時間帯など段階的に広げるという考え方もあります。また、すでに利用者がいる既存のバスの充実を優先することで、より確実な効果が期待できると考えます。" },
  { q: "広報に力を入れるとのことですが、具体的には何をしますか。", intent: "提案の具体化と実現可能性を見ます。", keywords: ["複数媒体", "高齢者対応", "定期的"], model: "まず町民が目にしやすい媒体を複数使います。広報紙に加えて、町の掲示板、Facebook、そして高齢の方には回覧板などです。また利用方法がわかりにくいという声に対応するため、時刻表を見やすくしたり、乗り方を説明するチラシを用意することも考えています。" },
  { q: "この提案を実行する上で、最も難しいと思われることは何ですか。", intent: "現実的な課題認識と解決策を見ます。", keywords: ["採算性", "関係機関調整", "利用促進"], model: "採算を取ることが難しいという点です。利用者を増やしたいですが、利用者が少ないうちは運行費用がかかります。この悪循環を抜けるまで、町の負担を覚悟する必要があります。そのため段階的な実行と、定期的な効果測定が必要だと考えます。" },

  // ========== カテゴリ4: 制度・計画理解（Q13-Q16） ==========
  { q: "大津町の人口動態についてご存知ですか。", intent: "自治体研究の深さを見ます。", keywords: ["人口減少", "高齢化", "データ"], model: "大津町の人口は約32000人で、減少傾向にあります。高齢化率も上昇していることから、移動に支援が必要な住民が増える可能性があります。だからこそ交通施策が重要だと考えました。" },
  { q: "第７次振興総合計画について知っていることを教えてください。", intent: "計画理解と自分の提案の位置づけを見ます。", keywords: ["計画", "方針", "連携"], model: "詳しく存じ上げておりませんが、大津町全体の方針があり、交通施策もその中の一つとして位置づけられていると考えています。本採用後は計画を詳しく学び、自分の職務がどのように貢献するのか理解したいと思っています。" },
  { q: "大津町の産業構造についてどう考えていますか。", intent: "地域経済への視点を見ます。", keywords: ["農業", "商業", "雇用"], model: "大津町は農業が基幹産業だと理解しています。交通の充実は、農産物の流通を支援したり、従業員の通勤を支援したりすることで、間接的に産業振興に貢献すると考えています。" },
  { q: "熊本県内の他自治体と比較して、大津町の特徴は何だと思いますか。", intent: "広い視野を持っているかを見ます。", keywords: ["位置", "特性", "機会"], model: "熊本市に近い利点があります。これにより若い世代の流出を防ぎながら、熊本市との連携による活性化も期待できると考えています。同時に農村部としての特性を活かした施策も重要だと思います。" },

  // ========== カテゴリ5: 職員実務能力（Q17-Q21） ==========
  { q: "役所の仕事で最も大事なことは何だと思いますか。", intent: "公務員としての価値観を見ます。", keywords: ["公平性", "説明責任", "信頼"], model: "公平性と説明責任だと考えます。自分たちの判断が町民の生活に直結するため、誰もが納得できるように丁寧に説明する責任があります。" },
  { q: "意見が異なる関係者とどのように調整しますか。", intent: "調整能力と根気強さを見ます。", keywords: ["傾聴", "妥協点", "記録"], model: "まず相手の意見を最後まで聞き、その背景にある課題を理解することが大切だと考えます。その上で、共通の目標（住民利益）に向かって、どの点で妥協できるかを探ります。重要な内容は記録に残し、後で誤解がないようにします。" },
  { q: "町民からのクレームを受けた場合、どう対応しますか。", intent: "住民対応の適切性を見ます。", keywords: ["傾聴", "報告", "改善"], model: "まずお話をしっかり聞き、相手の不満をきちんと理解します。その上で、すぐに上司に報告し、組織として対応する方針を決めます。重要なのは、一個人で判断せず、組織の一員として動くことだと思います。" },
  { q: "自分の提案が採用されない場合、どう受け止めますか。", intent: "組織人としての柔軟性を見ます。", keywords: ["上司の判断", "学習", "別の形"], model: "上司や先輩の判断を尊重します。その上で、なぜ採用されなかったのか理由を聞き、学習することを大切にしたいと思います。場合によっては、別の形で提案が活かされる可能性もあると考えています。" },
  { q: "仕事でミスをした場合、どのように対応しますか。", intent: "責任感と改善能力を見ます。", keywords: ["報告", "原因分析", "再発防止"], model: "まず報告します。その後原因を分析し、同じミスをしないためにはどうするか考えます。チェックリストを作るなど、仕組みで防ぐことも大事だと思っています。" },

  // ========== カテゴリ6: 志望動機と適性（Q22-Q25） ==========

  { q: "逆に、あなたの短所は何ですか。", intent: "自己認識の深さと改善意欲を見ます。", keywords: ["認識", "改善策", "努力"], model: "細部にこだわり過ぎることがあります。営業では完璧を目指すことは良い面でもあったのですが、役所では効率性も大事だと認識しています。本採用後は、バランスの取れた判断ができるように先輩からの指導を積極的に受けたいと思います。" },

  { q: "他の自治体の採用試験も受験していますか。", intent: "志望度と人生計画の真摯性を見ます。", keywords: ["志望度", "第一志望", "決意"], model: "はい、受験しています。しかし大津町が第一志望です。理由は、ここまで述べてきた通り、この町の交通課題に向き合いたいという強い思いがあるからです。" },

  { q: "最後に何か質問はありますか。（逆質問）", intent: "準備度、積極性、仕事への理解を見ます。", keywords: ["準備", "配属", "研修"], model: "配属部門と、新職員研修の内容について教えていただけますか。どの部門に配属されても貢献できるよう準備したいと考えています。また、先輩職員の指導体制についても教えていただけると幸いです。" }

let selectedQ = null;
let transcript = '';
let recognition = null;
let records = [];

function loadRecords() {
  try {
    const saved = localStorage.getItem('otsuRecords');
    records = saved ? JSON.parse(saved) : [];
  } catch (e) {
    records = [];
  }
}

function saveRecords() {
  try {
    localStorage.setItem('otsuRecords', JSON.stringify(records.slice(0, 5)));
  } catch (e) {
    console.error('記録保存エラー:', e);
  }
}

function initVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showStatus('お使いのブラウザは音声認識に対応していません。Chrome、Edge、Safariをお試しください。', 'error');
    return false;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('voiceBtn').textContent = '🔴 記録中...';
  };

  recognition.onresult = (event) => {
    transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    const box = document.getElementById('transcriptBox');
    box.textContent = transcript;
    box.classList.remove('empty');
    box.classList.add('filled');
  };

  recognition.onerror = (event) => {
    showStatus('音声認識エラー: ' + event.error, 'error');
  };

  recognition.onend = () => {
    document.getElementById('voiceBtn').classList.remove('recording');
    document.getElementById('voiceBtn').textContent = '🎤 音声入力開始';
  };

  return true;
}

function renderQuestions() {
  const container = document.getElementById('questionButtons');
  container.innerHTML = questions.map((q, idx) =>
    `<button class="q-btn" onclick="selectQuestion(${idx})">Q${String(idx + 1).padStart(2, '0')} ${q.q.substring(0, 25)}...</button>`
  ).join('');
}

function selectQuestion(idx) {
  selectedQ = idx;
  document.querySelectorAll('.q-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  const q = questions[idx];
  document.getElementById('questionDisplay').style.display = 'block';
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('intentText').textContent = q.intent;
  document.getElementById('keywordArea').innerHTML = q.keywords.map(k => `<span class="keyword">${k}</span>`).join('');
  document.getElementById('evalResultSection').style.display = 'none';
  document.getElementById('intentSection').style.display = 'block';
  hideStatus();
}

function toggleVoiceInput() {
  if (!recognition) {
    if (!initVoice()) return;
  }
  recognition.start();
}

function clearTranscript() {
  transcript = '';
  const box = document.getElementById('transcriptBox');
  box.textContent = '音声を記録してください';
  box.classList.add('empty');
  box.classList.remove('filled');
  document.getElementById('evalResultSection').style.display = 'none';
  hideStatus();
  if (recognition) recognition.stop();
}

function showStatus(message, type) {
  const statusDiv = document.getElementById('statusMessage');
  statusDiv.className = `msg ${type}`;
  statusDiv.textContent = message;
  statusDiv.style.display = 'block';
}

function hideStatus() {
  document.getElementById('statusMessage').style.display = 'none';
}

function getDetailedEvaluation() {
  if (selectedQ === null || !transcript.trim()) {
    showStatus('質問を選択して、音声入力を記録してください。', 'warning');
    return;
  }

  const q = questions[selectedQ];
  const evalBtn = document.getElementById('evalBtn');
  const loadingSection = document.getElementById('loadingSection');

  evalBtn.disabled = true;
  loadingSection.style.display = 'block';
  hideStatus();

  setTimeout(() => {
    try {
      const keywords = q.keywords || [];

      // 【採点計算】
      const scores = {};

      // 1. 時間の使い方（20点）
      const sentences = transcript.split(/[。、！？]/g).filter(s => s.trim().length > 0);
      let usage = 0;
      if (sentences.length >= 3) usage += 10;
      if (sentences.length >= 4) usage += 5;
      if (transcript.length > 100) usage += 5;
      scores.usage = Math.min(20, usage);

      // 2. 真点（内容）（30点）
      let keywordMatch = 0;
      keywords.forEach(k => {
        if (transcript.includes(k)) keywordMatch++;
      });
      const keywordRatio = keywordMatch / Math.max(keywords.length, 1);
      scores.content = Math.round(30 * keywordRatio);

      // 3. 具体性：ポイント（4点）
      let concrete = 0;
      if (transcript.match(/\d+/)) concrete += 2;
      if (transcript.match(/[例えば|具体的|実際]/)) concrete += 2;
      scores.specific = Math.min(4, concrete);

      // 4. 話し方：よくみわけている（20点）
      let expression = 0;
      if (transcript.match(/[考えます|思います|と判断します]/)) expression += 7;
      if (transcript.match(/[まず|その上で|そのため]/)) expression += 7;
      if (transcript.match(/[だからこそ|つまり]/)) expression += 6;
      scores.expression = Math.min(20, expression);

      // 5. 読む組み立て（15点）
      let structure = 0;
      if (sentences.length >= 3) structure += 8;
      if (transcript.match(/[また|一方|しかし]/)) structure += 4;
      if (transcript.match(/[まず|次に|最後に]/)) structure += 3;
      scores.structure = Math.min(15, structure);

      // 総合スコア
      const totalScore = scores.usage + scores.content + scores.specific + scores.expression + scores.structure;

      // フィードバック
      let good = [];
      let improve = [];

      if (scores.usage >= 15) good.push('時間を十分に使った、構造的な回答です');
      if (scores.content >= 20) good.push('重要なキーワードをよく含めています');
      if (scores.expression >= 12) good.push('適切な表現で、分かりやすく話せています');
      if (scores.structure >= 10) good.push('複数の文に分けて、論理的に説明できています');

      if (scores.usage < 15) improve.push('もっと詳しく説明してください。複数の文に分けることを意識しましょう');
      if (scores.content < 20) improve.push('重要なキーワードをもっと含めてください。模範回答を何度も読みましょう');
      if (scores.specific < 2) improve.push('具体的な例や数字を加えると、説得力が増します');
      if (scores.expression < 12) improve.push('「考えます」「そのため」など、適切な表現を使いましょう');
      if (scores.structure < 10) improve.push('複数の文に分けて、より体系的に説明することを意識してください');

      displayDetailedEvaluation({
        scores: scores,
        totalScore: totalScore,
        questionIdx: selectedQ,
        good: good,
        improve: improve
      }, q.model);

      showStatus('✓ 採点が完了しました', 'success');

    } catch (error) {
      console.error('エラー:', error.message);
      showStatus('採点エラー: ' + error.message, 'error');
    } finally {
      evalBtn.disabled = false;
      loadingSection.style.display = 'none';
    }
  }, 2000);
}

function displayDetailedEvaluation(result, modelAnswer) {
  const totalScoreDiv = document.getElementById('totalScore');
  const detailedScoresDiv = document.getElementById('detailedScores');
  const feedbackSectionDiv = document.getElementById('feedbackSection');

  totalScoreDiv.textContent = result.totalScore;

  // 項目別スコア
  let itemsHtml = '<div class="items-section">';
  itemsHtml += '<div class="items-title">📊 項目別の点数</div>';

  itemsHtml += '<div class="item-row"><div><div class="item-name">時間の使い方</div><div class="item-detail">時間を十分に使って、複数に分けて話せているか</div></div><div class="item-score"><div class="score-number">' + result.scores.usage + '</div><div class="score-max">/ 20</div></div></div>';
  itemsHtml += '<div class="item-row"><div><div class="item-name">真点（内容）</div><div class="item-detail">質問の要点をおさえた、重要なポイントが入っているか</div></div><div class="item-score"><div class="score-number">' + result.scores.content + '</div><div class="score-max">/ 30</div></div></div>';
  itemsHtml += '<div class="item-row"><div><div class="item-name">具体性：ポイント</div><div class="item-detail">具体的な例や理由（数字・場所）が入っているか</div></div><div class="item-score"><div class="score-number">' + result.scores.specific + '</div><div class="score-max">/ 4</div></div></div>';
  itemsHtml += '<div class="item-row"><div><div class="item-name">話し方：よくみわけている</div><div class="item-detail">「考えます」「そのため」など適切な表現を使えているか</div></div><div class="item-score"><div class="score-number">' + result.scores.expression + '</div><div class="score-max">/ 20</div></div></div>';
  itemsHtml += '<div class="item-row"><div><div class="item-name">読む組み立て</div><div class="item-detail">複数の文で、体系的に説明されているか</div></div><div class="item-score"><div class="score-number">' + result.scores.structure + '</div><div class="score-max">/ 15</div></div></div>';
  itemsHtml += '</div>';

  detailedScoresDiv.innerHTML = itemsHtml;

  // フィードバック
  let feedbackHtml = '<div class="feedback-section">';
  feedbackHtml += '<div class="feedback-title">✓ 良かった点</div>';
  result.good.forEach(item => {
    feedbackHtml += `<div class="feedback-box feedback-good"><div class="feedback-content">・${item}</div></div>`;
  });

  feedbackHtml += '<div class="feedback-title">△ 改善すべき点</div>';
  result.improve.forEach(item => {
    feedbackHtml += `<div class="feedback-box feedback-improve"><div class="feedback-content">・${item}</div></div>`;
  });

  feedbackHtml += '<div class="model-answer">';
  feedbackHtml += '<div class="model-title">📝 模範回答例</div>';
  feedbackHtml += `<div class="model-content">${modelAnswer}</div>`;
  feedbackHtml += '</div>';

  feedbackHtml += '</div>';

  feedbackSectionDiv.innerHTML = feedbackHtml;

  // 記録を保存用に一時保存
  window.lastEvalResult = result;

  document.getElementById('evalResultSection').style.display = 'block';
  displayRecords();
  window.scrollTo(0, document.getElementById('evalResultSection').offsetTop);
}

function saveRecord() {
  if (!window.lastEvalResult) return;

  const result = window.lastEvalResult;
  const q = questions[result.questionIdx];

  const record = {
    time: new Date().toLocaleString('ja-JP'),
    question: q.q.substring(0, 30) + '...',
    score: result.totalScore,
    scores: result.scores
  };

  records.unshift(record);
  records = records.slice(0, 5);
  saveRecords();

  displayRecords();
  showStatus('✓ 結果を保存しました', 'success');
}

function displayRecords() {
  const container = document.getElementById('recordsList');
  if (records.length === 0) {
    container.innerHTML = '<div class="record-item" style="color: #999;">まだ記録がありません</div>';
    return;
  }

  container.innerHTML = records.map((r, idx) => `
    <div class="record-item">
      <div class="record-header">
        <div class="record-time">▼ ${r.time.split(' ')[1]}</div>
        <div class="record-score">${r.score}点</div>
      </div>
      <div class="record-detail">${r.question}</div>
    </div>
  `).join('');
}

window.addEventListener('load', () => {
  loadRecords();
  initVoice();
  renderQuestions();
  displayRecords();
});
</script>
